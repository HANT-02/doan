  <text x="645" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">Mô tả lịch tuần cố định của từng lớp</text>
  <rect x="643" y="340" width="314" height="64" rx="16" fill="#f8fafc"/>
  <text x="667" y="379" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">class_id: CLS-MATH-01</text>
  <rect x="643" y="420" width="314" height="64" rx="16" fill="#f8fafc"/>
  <text x="667" y="459" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">day_of_week: MONDAY</text>
  <rect x="643" y="500" width="314" height="64" rx="16" fill="#f8fafc"/>
  <text x="667" y="539" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">shift_id: ca1</text>
