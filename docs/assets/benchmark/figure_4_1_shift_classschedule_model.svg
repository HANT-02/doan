  <text x="1170" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">Miền giá trị được sinh ra từ Shift + ClassSchedule</text>
  <rect x="1168" y="346" width="314" height="94" rx="18" fill="#ecfdf5"/>
