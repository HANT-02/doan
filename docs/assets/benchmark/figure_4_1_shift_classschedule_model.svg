  <rect x="488" y="776" width="624" height="80" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="518" y="824" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Ý nghĩa: Shift chuẩn hóa khung giờ, ClassSchedule chuẩn hóa lịch tuần, từ đó solver làm việc trên miền slot thống nhất.</text>
