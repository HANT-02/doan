<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="86" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Hình 4.1. Minh họa mô hình Shift và ClassSchedule trong scheduling</text>
  <text x="80" y="126" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Hai thực thể nghiệp vụ này là nền để solver sinh ra các slot hợp lệ trước khi tạo preview assignment.</text>

  <rect x="80" y="190" width="390" height="560" rx="28" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
