  <text x="667" y="699" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">is_active: true</text>

  <rect x="1130" y="190" width="390" height="560" rx="28" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
