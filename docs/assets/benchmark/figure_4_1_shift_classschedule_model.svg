  <text x="142" y="699" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">duration_minutes: 120</text>

  <rect x="605" y="190" width="390" height="560" rx="28" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
