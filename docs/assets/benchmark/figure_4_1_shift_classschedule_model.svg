  <text x="120" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">Mô tả ca học chuẩn của trung tâm</text>
  <rect x="118" y="340" width="314" height="64" rx="16" fill="#eff6ff"/>
  <text x="142" y="379" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">code: ca1</text>
