  <rect x="1168" y="460" width="314" height="94" rx="18" fill="#ecfdf5"/>
  <text x="1192" y="496" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#065f46">Slot 2</text>
  <text x="1192" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#065f46">WEDNESDAY | ca1 | 07:00-09:00 | ROOM-A102</text>
  <rect x="1168" y="574" width="314" height="132" rx="18" fill="#eff6ff"/>
  <text x="1192" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">Preview assignment sẽ chọn từ các slot trên</text>
  <text x="1192" y="646" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">sau khi kiểm tra:</text>
  <text x="1210" y="678" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">- teacher conflict</text>
  <text x="1210" y="706" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e3a8a">- class conflict</text>

  <path d="M470 470 C520 470, 555 470, 605 470" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <polygon points="605,470 585,458 585,482" fill="#94a3b8"/>
  <path d="M995 470 C1045 470, 1080 470, 1130 470" fill="none" stroke="#94a3b8" stroke-width="5"/>
