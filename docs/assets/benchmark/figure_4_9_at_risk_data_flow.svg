<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="980" viewBox="0 0 1720 980">
  <rect width="1720" height="980" fill="#f8fafc"/>
  <text x="72" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Hình 4.4. Luồng dữ liệu phục vụ bài toán dự báo AT_RISK</text>
  <text x="72" y="122" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Kiến trúc được chuẩn hóa theo hướng DB/CSV -&gt; Python ML -&gt; artifact -&gt; Go API -&gt; giao diện người dùng.</text>

  <rect x="70" y="200" width="280" height="120" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
  <rect x="70" y="360" width="280" height="120" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
  <text x="120" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2563eb">PostgreSQL</text>
  <text x="108" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">students, enrollments, lessons,</text>
  <text x="102" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">attendance, summaries, records</text>
  <text x="154" y="412" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2563eb">CSV</text>
  <text x="106" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">dataset demo hoặc dữ liệu export</text>

  <rect x="450" y="160" width="360" height="520" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="510" y="224" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Python ML Project</text>
  <text x="500" y="278" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">1. Load dữ liệu từ DB hoặc CSV</text>
  <text x="500" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">2. Chuẩn hóa schema student_class_snapshot</text>
  <text x="500" y="354" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">3. Feature engineering 28 ngày quan sát</text>
  <text x="500" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">4. Labeling 28 ngày dự báo</text>
  <text x="500" y="430" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">5. Train/test split</text>
  <text x="500" y="468" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">6. Train 3 mô hình</text>
  <text x="532" y="506" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1e3a8a">- Rule-based baseline</text>
  <text x="532" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1e3a8a">- Logistic Regression</text>
  <text x="532" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1e3a8a">- Random Forest</text>
  <text x="500" y="616" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1e3a8a">7. Evaluate và chọn mô hình chính</text>

  <rect x="930" y="170" width="320" height="220" rx="28" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
  <text x="1006" y="230" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Artifact</text>
  <text x="966" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">model_metadata.json</text>
  <text x="966" y="320" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">metrics.json</text>
  <text x="966" y="354" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">latest_predictions.json</text>

  <rect x="930" y="450" width="320" height="220" rx="28" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
  <text x="976" y="510" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Figure &amp; Report</text>
  <text x="966" y="566" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">classification_report.md</text>
  <text x="966" y="600" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">confusion_matrix.png</text>
  <text x="966" y="634" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">feature_importance.png</text>

  <rect x="1380" y="250" width="260" height="160" rx="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1458" y="312" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#92400e">Go API</text>
  <text x="1420" y="360" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#92400e">đọc artifact và phục vụ</text>
  <text x="1420" y="390" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#92400e">/predictive và /student/at-risk</text>

  <rect x="1380" y="500" width="260" height="220" rx="28" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="1424" y="562" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#166534">Frontend</text>
  <text x="1416" y="614" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">- Admin predictive dashboard</text>
  <text x="1416" y="646" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">- Student AT_RISK alert</text>
  <text x="1416" y="678" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">- risk_score / risk_band</text>

  <g stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="350" y1="260" x2="450" y2="260"/>
    <line x1="350" y1="420" x2="450" y2="420"/>
    <line x1="810" y1="290" x2="930" y2="290"/>
    <line x1="810" y1="560" x2="930" y2="560"/>
