    <line x1="1250" y1="560" x2="1380" y2="610"/>
    <line x1="1510" y1="410" x2="1510" y2="500"/>
  </g>

  <polygon points="438,252 450,260 438,268" fill="#94a3b8"/>
  <polygon points="438,412 450,420 438,428" fill="#94a3b8"/>
